    header: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lZAPROSZENIE PVP
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &achce się z Tobą bić!
      
    
    accept-button: "&a&l[► AKCEPTUJ ◄]"
    accept-hover: "&aKliknij, aby zaakceptować zaproszenie!"
    deny-button: " &c&l[✖ ODRZUĆ]"
    deny-hover: "&cKliknij, aby odrzucić zaproszenie"
