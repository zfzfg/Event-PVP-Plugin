# ============================================
# PvPWager - メッセージ設定（日本語）
# ============================================

messages:
  prefix: "&6[PvP]&r"
  
  # ===== リクエストシステム =====
  request:
    sent: "&a&e{player} &aにPvPリクエストを送信しました！"
    
    received: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lPVPリクエスト
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aがあなたと戦いたがっています！
      
      &a承諾するにはここをクリック:
      
    received-clickable: "&a&l[► 承諾する ◄]"
    received-expire: "&7リクエストは &e60秒 &7で期限切れになります。"
    
    accepted: "&a&e{player} &aのリクエストを承諾しました！"
    denied: "&c&e{player} &cのリクエストを拒否しました！"
    expired: "&c&e{player} &cからのリクエストが期限切れになりました！"
    cancelled: "&c&e{player} &cへのリクエストをキャンセルしました！"
    
    no-request: "&cこのプレイヤーからのリクエストはありません！"
    already-sent: "&c既にこのプレイヤーにリクエストを送信しています！"
    already-in-match: "&cこのプレイヤーは既にマッチ中です！"
    self-request: "&c自分自身にリクエストを送ることはできません！"
    player-offline: "&cこのプレイヤーはオンラインではありません！"
    
    # Request Components
    header: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lPVPリクエスト
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aがあなたと戦いたがっています！
      
    
    accept-button: "&a&l[► 承試する ◄]"
    accept-hover: "&aクリックしてリクエストを承試しましょう！"
    deny-button: " &c&l[✖ 拒否]"
    deny-hover: "&cクリックしてリクエストを拒否します"
    footer: |
      
      
      &7リクエストは &e60秒 &7で期限切れになります。
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
    
    # Command Request Messages
    request-expired-sender: "&c&e{target} &cへのリクエストが期限切れになりました！"
    request-expired-target: "&c&e{sender} &cからのリクエストが期限切れになりました！"
    challenge-header: "&e&lPVPチャレンジ！"
    challenge-message: "&e{player} &7があなたに挑戦してきました！"
  
  # ===== 賭け設定 =====
  wager:
    setup-start: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&l賭けを設定
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7アイテムやお金を
      &7GUIに入れてください！
      
      &7準備ができたら &a&l確認 &7を押してください。
      
    
    waiting-opponent: |
      &e&l{player}を待機中...
      &7相手が賭けを
      &7設定しています。
    
    both-ready: |
      &a&l両プレイヤー準備完了！
      &7アリーナと装備を選択してください。
    
    item-added: "&aアイテムを賭けに追加しました！"
    item-removed: "&cアイテムを賭けから削除しました！"
    money-set: "&aお金の賭けを設定: &6${amount}"
    money-increased: "&aお金の賭けを増額: &6${amount}"
    money-decreased: "&cお金の賭けを減額: &6${amount}"
    
    not-enough-money: "&cお金が足りません！（&6${amount} &c必要）"
    inventory-full-self: "&cインベントリに少なくとも &e{slots} &cスロットの空きが必要です！"
    inventory-full-opponent: "&c相手のインベントリに空きがありません！"
    min-bet-required: "&c最低 &e{amount} &cアイテムまたは &6${money} &cが必要です！"
    
    cancelled: "&c賭けの設定がキャンセルされました！"
  
  # ===== アリーナ＆装備選択 =====
  selection:
    arena-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lアリーナを選択
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7マッチ用のアリーナを
      &7選んでください！
      
    
    arena-selected: "&aアリーナを選択: &e{arena}"
    
    equipment-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&l装備を選択
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7マッチ用の装備セットを
      &7選んでください！
      
    
    equipment-selected: "&a装備を選択: &e{equipment}"
    
    waiting-opponent-choice: |
      &e&l{player}を待機中...
      &7相手がまだ選択中です。
    
    both-selected: |
      &a&l全ての選択が完了！
      &7マッチがまもなく開始...

  # ===== コマンド =====
  command:
    common:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      player-offline: "&cプレイヤーが見つかりません: {player}"
      self-target: "&c自分自身に挑戦することはできません！"
      already-in-match: "&c既にマッチ中です！"
      target-in-match: "&c{player}は既にマッチ中です！"
      pending-self: "&c既に保留中のリクエストがあります！"
      pending-target: "&c{player}は既に保留中のリクエストがあります！"
      not-spectating: "&c現在マッチを観戦していません！"
      match-full: "&cこのマッチは観戦者数上限に達しています！"
    pvpa:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      player-not-found: "&cプレイヤーが見つかりません: {player}"
      self-challenge: "&c自分自身に挑戦することはできません！"
      arena-not-found: "&cアリーナが見つかりません: {arena}"
      equipment-not-found: "&c装備が見つかりません: {equipment}"
      amount-positive: "&c金額は正の数である必要があります！"
      economy-disabled: "&cエコノミーが有効になっていません！"
      not-enough-money: "&cお金が足りません！残高: ${balance}"
      invalid-money: "&c無効な金額: {amount}"
      mismatch-items: "&cアイテム数と数量が一致しません！"
      not-enough-items: "&c以下のアイテムが足りません: {item}"
      invalid-item: "&c無効なアイテム: {item}"
      wager-money: "&6${amount}"
      wager-items: "&e{count}個のアイテム"
      request-sent: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lリクエスト送信完了！
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7対象: &e{target}
        &7アリーナ: &e{arena}
        &7装備: &e{equipment}
        &7賭け: {wager}
        
        &e{target}&7の返答を待っています...
        
      usage: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lPVPAコマンド
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7使用方法:
        &e/pvpa <プレイヤー> <賭け> <数量> <アリーナ> <装備>
        
        &7例:
        &e/pvpa Steve DIAMOND_SWORD 1 desert diamond
        &e/pvpa Steve MONEY 100 forest standard
        &e/pvpa Steve DIAMOND_SWORD,GOLDEN_APPLE 1,5 colosseum netherite
        
        &7アリーナ一覧: &e/pvpa arenas
        &7装備一覧: &e/pvpa equipment
        
      available-arenas: "&7利用可能なアリーナ:"
      available-equipment: "&7利用可能な装備セット:"
    pvpyes:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      no-request: "&c保留中のリクエストはありません！"
      waiting-response: "&c{player}の返答を待っています！"
      sender-no-money: "&cお金が足りなくなりました！"
      sender-no-items: "&c必要なアイテムがなくなりました！"
      target-no-money-player: "&c{player}のお金が足りなくなりました！"
      target-no-money-target: "&cお金が足りなくなりました – リクエストがキャンセルされました！"
      target-no-items-player: "&c{player}の必要なアイテムがなくなりました！"
      target-no-items-target: "&c必要なアイテムがなくなりました – リクエストがキャンセルされました！"
    pvpadmin:
      no-permission: "&cこのコマンドの権限がありません！"
      reload-success: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&l設定を再読み込みしました！
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7✓ メイン設定を再読み込み
        &7✓ メッセージを再読み込み
        &7✓ アリーナを再読み込み: &e{arenaCount}
        &7✓ 装備セットを再読み込み: &e{equipmentCount}
        
        &e注意: &7進行中のマッチには影響しません
        
      reload-error: "&c再読み込みエラー: {error}"
      stopall: |
        
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lマッチを停止しました
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7停止したアクティブマッチ: &e{count}
        &7全ての賭けが返却されました
        
      info: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lPVPWAGER情報
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7バージョン: &e{version}
        &7アクティブマッチ: &e{active}
        &7読み込み済みアリーナ: &e{arenas}
        &7読み込み済み装備: &e{equipment}
        &7エコノミー: {economy}
        
      enabled: "&a有効"
      disabled: "&c無効"
      help: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lPVPWAGER管理者
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &e/pvpadmin reload &8- &7全ての設定を再読み込み
        &e/pvpadmin stopall &8- &7全てのアクティブマッチを停止
        &e/pvpadmin info &8- &7プラグイン情報を表示

    pvpanswer:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      no-request: "&c保留中のリクエストはありません！"
      usage: |
        &c使用方法: /pvpanswer <賭け> <数量> [アリーナ] [装備]
        &7例: /pvpanswer DIAMOND_SWORD 1
        &7例: /pvpanswer MONEY 50 desert diamond
        &7例: /pvpanswer SKIP
      arena-not-found: "&cアリーナが見つかりません: {arena}"
      equipment-not-found: "&c装備が見つかりません: {equipment}"
      missing-money: "&cMONEYの金額が指定されていません！"
      amount-positive: "&c金額は正の数である必要があります！"
      economy-disabled: "&cエコノミーが有効になっていません！"
      not-enough-money: "&cお金が足りません！"
      invalid-money: "&c無効な金額: {amount}"
      missing-items: "&cアイテム賭けの数量が指定されていません！"
      mismatch-items: "&c数量とアイテムが一致しません！"
      not-enough-items: "&c以下のアイテムが足りません: {item}"
      invalid-item: "&c無効なアイテム: {item}"
      response-sent: "&a&l返答を送信しました！"
      your-wager-money: "&7あなたの賭け: &6${amount}"
      your-wager-items: "&7あなたの賭け: &e{items}"
      arena-override: "&7アリーナ変更: &e{arena}"
      equipment-override: "&7装備変更: &e{equipment}"
      waiting-confirm: "&e{player} &7の確認を待っています..."
      challenger-header: "&e&l{player}が返答しました！"
      their-wager-money: "&7相手の賭け: &6${amount}"
      their-wager-items: "&7相手の賭け: &e{items}"
      arena-changed: "&7アリーナ変更: &e{arena}"
      equipment-changed: "&7装備変更: &e{equipment}"
      next-steps: "&a承諾: &e/pvpyes\n&c拒否: &e/pvpno"

    pvp:
      help: |
        &e&lPvPWager &8» &7使用方法:
        &e/pvpa <プレイヤー> &8- &7PvP賭けを送信
        &e/pvp accept <プレイヤー> &8- &7リクエストを承諾
        &e/pvp deny <プレイヤー> &8- &7リクエストを拒否
        &e/pvp spectate <プレイヤー> &8- &7マッチを観戦
        &e/pvp leave &8- &7観戦モードを終了
      accept:
        success-self: "&a&e{player} &aからのPvP賭けを承諾しました！"
        success-other: "&e{player} &aがあなたのPvP賭けを承諾しました！"
        no-request: "&c&e{player} &cからの保留中のリクエストはありません！"
        requires-skip: "&c承諾できません: 挑戦者がSKIPを選択していません。まず &e/pvpanswer <賭け> <数量> &cで賭けを設定してから確認してください。"
      deny:
        success-self: "&c&e{player} &cからのPvP賭けを拒否しました！"
        success-other: "&e{player} &cがあなたのPvP賭けを拒否しました！"
        usage: "&c使用方法: /pvp deny <プレイヤー>"
      spectate:
        usage: "&c使用方法: /pvp spectate <プレイヤー>"
        no-match: "&c{player}はマッチ中ではありません！"
        joined: "&a&e{p1} &7vs &e{p2} &aを観戦中！"
        announce: "&e{player} &7がマッチを観戦しています！"
      leave:
        left: "&a観戦モードを終了しました！"
        announce: "&e{player} &7が観戦モードを終了しました！"

    pvprequest:
      usage: "&c使用方法: /pvpa <プレイヤー>"
      sent: "&a&e{player} &aにPvP賭けを送信しました！"

    pvpno:
      no-request: "&c保留中のリクエストはありません！"
      declined-self: "&c&e{player} &cへの/からのリクエストを拒否しました"
      declined-other: "&e{player} &cがリクエストを拒否しました！"

    challenge:
      usage: "&c使用方法: /pvp challenge <プレイヤー> [賭け] [数量] [アリーナ] [装備]"
      no-config: "&cアリーナまたは装備が設定されていません！"
      sent: "&a&e{player} &aにPvP賭けを送信しました！"

    draw:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      only-active: "&c引き分け投票はマッチ中のみ可能です！"
      no-active-vote: "&cアクティブな引き分け投票がありません！"
      initiator-wait: "&c投票を開始しました、相手の返答を待ってください！"
      initiator-cannot-deny: "&cあなたがこの投票を開始しました！キャンセルするには &e/draw &cをもう一度入力してください。"
      cancelled-self: "&c引き分け投票をキャンセルしました。"
      cancelled-opponent: "&e{player} &cが引き分け投票をキャンセルしました。"
      already-active: "&e{opponent} &7が既に引き分けを提案しています！\n&7入力: &a/draw accept &7または &c/draw deny"
      accepted: "&a&l━━━━━━━━━━━━━━━━━━━━━━━\n&a&l引き分け成立！\n&a&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7両プレイヤーが引き分けに同意しました。\n&7全ての賭けが返却されます。"
      denied: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l引き分け拒否！\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{player} &7が投票を拒否しました。\n&7マッチを続行！"
      started: "&e&l━━━━━━━━━━━━━━━━━━━━━━━\n&e&l引き分け投票\n&e&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{initiator} &7がマッチを引き分けで終了したがっています。\n\n&e{opponent}&7、入力してください:\n  &a/draw accept &7- 引き分けを承諾\n  &c/draw deny &7- 引き分けを拒否\n\n&7制限時間: &e{time}秒"
      expired: "&c&l投票期限切れ！\n&7マッチを続行。"

    surrender:
      player-only: "&cこのコマンドはプレイヤーのみ使用できます！"
      only-active: "&c降参はマッチ中のみ可能です！"
      confirm: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l警告: 降参\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7本当に降参しますか？\n&c全ての賭けを失います！\n\n&7確認: &e/surrender confirm\n&7または {timeout}秒待ってキャンセル"
      confirm-expired: "&c確認の期限が切れました！もう一度 &e/surrender &cを入力してください。"
      surrendered: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l{player}が降参しました！\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{opponent} &aがマッチに勝利！"
        
  
  # ===== マッチ =====
  match-display:
    starting: "&eマッチ開始まで &6&l{time} &e秒！"
    started: |
      
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      &a&lマッチ開始！
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7頑張ってください！
      
    
    spectator-join-announce: "&7{player} &eが観戦を開始しました。"
    spectator-leave-announce: "&7{player} &eが観戦を終了しました。"
    
    spectator-joined: "&a&e{player1} &avs &e{player2} &aを観戦中！"
    spectator-left: "&7観戦を終了しました。"
    
    boundaries-warning: "&c&l警告: &cアリーナ境界に到達！"
    you-won-header: "&a&l━━━━━━━━━━━━━━━━━━━━━━━"
