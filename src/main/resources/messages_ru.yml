# ============================================
# PvPWager - Конфигурация сообщений (РУССКИЙ)
# ============================================

messages:
  prefix: "&6[PvP]&r"
  
  # ===== СИСТЕМА ЗАПРОСОВ =====
  request:
    sent: "&aВы отправили PvP-запрос игроку &e{player}&a!"
    
    received: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lPVP-ЗАПРОС
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aхочет сразиться с вами!
      
      &aНажмите здесь, чтобы принять:
      
    received-clickable: "&a&l[► ПРИНЯТЬ ◄]"
    received-expire: "&7Запрос истечет через &e60 секунд&7."
    
    accepted: "&aВы приняли запрос от &e{player}&a!"
    denied: "&cВы отклонили запрос от &e{player}&c!"
    expired: "&cЗапрос от &e{player} &cистек!"
    cancelled: "&cВы отменили свой запрос игроку &e{player}&c!"
    
    no-request: "&cУ вас нет запроса от этого игрока!"
    already-sent: "&cВы уже отправили запрос этому игроку!"
    already-in-match: "&cЭтот игрок уже в бою!"
    self-request: "&cНельзя отправить запрос самому себе!"
    player-offline: "&cЭтот игрок офлайн!"
    
    # Компоненты запроса
    header: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lPVP-ЗАПРОС
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aхочет сразиться с вами!
      
    
    accept-button: "&a&l[► ПРИНЯТЬ ◄]"
    accept-hover: "&aНажмите, чтобы принять запрос!"
    deny-button: " &c&l[✖ ОТКЛОНИТЬ]"
    deny-hover: "&cНажмите, чтобы отклонить запрос"
    footer: |
      
      
      &7Запрос истечет через &e60 секунд&7.
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
    
    # Сообщения командных запросов
    request-expired-sender: "&cВаш запрос игроку &e{target} &cистек!"
    request-expired-target: "&cЗапрос от &e{sender} &cистек!"
    challenge-header: "&e&lPVP ВЫЗОВ!"
    challenge-message: "&e{player} &7вызвал вас на бой!"
  
  # ===== НАСТРОЙКА СТАВКИ =====
  wager:
    setup-start: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lНАСТРОЙТЕ СТАВКУ
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Поместите предметы и/или деньги
      &7в GUI!
      
      &7Нажмите &a&lПОДТВЕРДИТЬ &7когда будете готовы.
      
    
    waiting-opponent: |
      &e&lОжидание {player}...
      &7Ваш противник настраивает
      &7свою ставку.
    
    both-ready: |
      &a&lОБА ИГРОКА ГОТОВЫ!
      &7Теперь выберите арену и экипировку.
    
    item-added: "&aПредмет добавлен в ставку!"
    item-removed: "&cПредмет удален из ставки!"
    money-set: "&aДенежная ставка установлена: &6${amount}"
    money-increased: "&aДенежная ставка увеличена: &6${amount}"
    money-decreased: "&cДенежная ставка уменьшена: &6${amount}"
    
    not-enough-money: "&cНедостаточно денег! Нужно &6${amount}&c"
    inventory-full-self: "&cУ вас должно быть минимум &e{slots} &cсвободных слотов!"
    inventory-full-opponent: "&cУ противника недостаточно места в инвентаре!"
    min-bet-required: "&cНужно минимум &e{amount} &cпредметов или &6${money}&c!"
    
    cancelled: "&cНастройка ставки отменена!"
  
  # ===== ВЫБОР АРЕНЫ И ЭКИПИРОВКИ =====
  selection:
    arena-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lВЫБОР АРЕНЫ
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Выберите арену для
      &7вашего матча!
      
    
    arena-selected: "&aАрена выбрана: &e{arena}"
    
    equipment-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lВЫБОР ЭКИПИРОВКИ
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Выберите набор экипировки
      &7для боя!
      
    
    equipment-selected: "&aЭкипировка выбрана: &e{equipment}"
    
    waiting-opponent-choice: |
      &e&lОжидание {player}...
      &7Ваш противник все еще выбирает.
    
    both-selected: |
      &a&lВСЕ ВЫБРАНО!
      &7Матч скоро начнется...

  # ===== КОМАНДЫ =====
  command:
    common:
      player-only: "&cКоманду могут использовать только игроки!"
      player-offline: "&cИгрок не найден: {player}"
      self-target: "&cНельзя нацелиться на себя!"
      already-in-match: "&cВы уже в матче!"
      target-in-match: "&c{player} уже в матче!"
      pending-self: "&cУ вас уже есть активный запрос!"
      pending-target: "&cУ {player} уже есть активный запрос!"
      not-spectating: "&cВы не наблюдаете ни один матч!"
      match-full: "&cВ матче слишком много зрителей!"
    pvpa:
      player-only: "&cКоманду могут использовать только игроки!"
      player-not-found: "&cИгрок не найден: {player}"
      self-challenge: "&cНельзя вызвать самого себя!"
      arena-not-found: "&cАрена не найдена: {arena}"
      equipment-not-found: "&cЭкипировка не найдена: {equipment}"
      amount-positive: "&cКоличество должно быть положительным!"
      economy-disabled: "&cЭкономика не включена!"
      not-enough-money: "&cНедостаточно денег! У вас: ${balance}"
      invalid-money: "&cНеверная сумма: {amount}"
      mismatch-items: "&cНесовпадение предметов и количеств!"
      not-enough-items: "&cУ вас недостаточно: {item}"
      invalid-item: "&cНеверный предмет: {item}"
      wager-money: "&6$${amount}"
      wager-items: "&e{count} предмет(ов)"
      request-sent: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lЗАПРОС ОТПРАВЛЕН!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Цель: &e{target}
        &7Арена: &e{arena}
        &7Экипировка: &e{equipment}
        &7Ставка: {wager}
        
        &7Ожидание ответа &e{target}&7...
        
      usage: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lКОМАНДА PVPA
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Использование:
        &e/pvpa <игрок> <ставка> <кол-во> <арена> <экипировка>
        
        &7Примеры:
        &e/pvpa Steve DIAMOND_SWORD 1 desert diamond
        &e/pvpa Steve MONEY 100 forest standard
        &e/pvpa Steve DIAMOND_SWORD,GOLDEN_APPLE 1,5 colosseum netherite
        
        &7Используйте &e/pvpa arenas &7для списка арен
        &7Используйте &e/pvpa equipment &7для списка экипировки
        
      available-arenas: "&7Доступные арены:"
      available-equipment: "&7Доступная экипировка:"
    pvpyes:
      player-only: "&cКоманду могут использовать только игроки!"
      no-request: "&cНет активного запроса!"
      waiting-response: "&cОжидание ответа {player}!"
      sender-no-money: "&cУ вас больше нет достаточно денег!"
      sender-no-items: "&cУ вас больше нет нужных предметов!"
      target-no-money-player: "&c{player} больше не имеет достаточно денег!"
      target-no-money-target: "&cУ вас недостаточно денег — запрос отменен!"
      target-no-items-player: "&c{player} больше не имеет нужных предметов!"
      target-no-items-target: "&cУ вас нет нужных предметов — запрос отменен!"
    pvpadmin:
      no-permission: "&cУ вас нет прав на эту команду!"
      reload-success: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lКОНФИГ ПЕРЕЗАГРУЖЕН!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7✓ Основная конфигурация перезагружена
        &7✓ Сообщения перезагружены
        &7✓ Арены загружены: &e{arenaCount}
        &7✓ Наборы экипировки загружены: &e{equipmentCount}
        
        &eПримечание: &7Активные матчи не затронуты
        
      reload-error: "&cОшибка при перезагрузке: {error}"
      stopall: |
        
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lМАТЧИ ОСТАНОВЛЕНЫ
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Остановлено &e{count} &7активных матч(ей)
        &7Все ставки возвращены
        
      info: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lPVPWAGER ИНФО
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Версия: &e{version}
        &7Активные матчи: &e{active}
        &7Загружено арен: &e{arenas}
        &7Загружено экипировки: &e{equipment}
        &7Экономика: {economy}
        
      enabled: "&aВключено"
      disabled: "&cВыключено"
      help: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lPVPWAGER АДМИН
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &e/pvpadmin reload &8- &7Перезагрузить конфиги
        &e/pvpadmin stopall &8- &7Остановить все активные матчи
        &e/pvpadmin info &8- &7Показать информацию о плагине
        
  
    pvpanswer:
      player-only: "&cКоманду могут использовать только игроки!"
      no-request: "&cНет активного запроса!"
      usage: |
        &cИспользование: /pvpanswer <ставка> <кол-во> [арена] [экипировка]
        &7Пример: /pvpanswer DIAMOND_SWORD 1
        &7Пример: /pvpanswer MONEY 50 desert diamond
        &7Пример: /pvpanswer SKIP
      arena-not-found: "&cАрена не найдена: {arena}"
      equipment-not-found: "&cЭкипировка не найдена: {equipment}"
      missing-money: "&cНе указана сумма для MONEY!"
      amount-positive: "&cСумма должна быть положительной!"
      economy-disabled: "&cЭкономика не включена!"
      not-enough-money: "&cНедостаточно денег!"
      invalid-money: "&cНеверная сумма: {amount}"
      missing-items: "&cНе указано количество для предметной ставки!"
      mismatch-items: "&cНесовпадение предметов и количеств!"
      not-enough-items: "&cУ вас недостаточно: {item}"
      invalid-item: "&cНеверный предмет: {item}"
      response-sent: "&a&lОТВЕТ ОТПРАВЛЕН!"
      your-wager-money: "&7Ваша ставка: &6${amount}"
      your-wager-items: "&7Ваша ставка: &e{items}"
      arena-override: "&7Арена изменена на: &e{arena}"
      equipment-override: "&7Экипировка изменена на: &e{equipment}"
      waiting-confirm: "&7Ожидание подтверждения от &e{player}&7..."
      challenger-header: "&e&l{player} ОТВЕТИЛ!"
      their-wager-money: "&7Их ставка: &6${amount}"
      their-wager-items: "&7Их ставка: &e{items}"
      arena-changed: "&7Арена изменена на: &e{arena}"
      equipment-changed: "&7Экипировка изменена на: &e{equipment}"
      next-steps: "&aВведите &e/pvpyes &aчтобы принять\n&cВведите &e/pvpno &cчтобы отклонить"
    pvp:
      help: |
        &e&lPvPWager &8» &7Использование:
        &e/pvpa <игрок> &8- &7Отправить запрос
        &e/pvp accept <игрок> &8- &7Принять запрос
        &e/pvp deny <игрок> &8- &7Отклонить запрос
        &e/pvp spectate <игрок> &8- &7Наблюдать матч
        &e/pvp leave &8- &7Покинуть режим наблюдателя
      accept:
        success-self: "&aВы приняли PvP-запрос от &e{player}&a!"
        success-other: "&e{player} &aпринял ваш PvP-запрос!"
        no-request: "&cНет активного запроса от &e{player}&c!"
        requires-skip: "&cНельзя принять: вызывающий не выбрал SKIP. Сначала задайте ставку через &e/pvpanswer <ставка> <кол-во>&c."
      deny:
        success-self: "&cВы отклонили PvP-запрос от &e{player}&c!"
        success-other: "&e{player} &cотклонил ваш PvP-запрос!"
        usage: "&cИспользование: /pvp deny <игрок>"
      spectate:
        usage: "&cИспользование: /pvp spectate <игрок>"
        no-match: "&c{player} не в матче!"
        joined: "&aВы наблюдаете &e{p1} &7против &e{p2}&a!"
        announce: "&e{player} &7наблюдает за матчем!"
      leave:
        left: "&aВы покинули режим наблюдателя!"
        announce: "&e{player} &7покинул режим наблюдателя!"
    pvprequest:
      usage: "&cИспользование: /pvpa <игрок>"
      sent: "&aОтправлен PvP-запрос игроку &e{player}&a!"
    pvpno:
      no-request: "&cНет активного запроса!"
      declined-self: "&cВы отклонили запрос с/к &e{player}"
      declined-other: "&e{player} &cотклонил запрос!"
    challenge:
      usage: "&cИспользование: /pvp challenge <игрок> [ставка] [кол-во] [арена] [экипировка]"
      no-config: "&cНет настроенных арен или экипировки!"
      sent: "&aОтправлен PvP-запрос игроку &e{player}&a!"
    draw:
      player-only: "&cКоманду могут использовать только игроки!"
      only-active: "&cГолосовать за ничью можно только в активном матче!"
      no-active-vote: "&cНет активного голосования за ничью!"
      initiator-wait: "&cВы инициировали голосование, дождитесь ответа противника!"
      initiator-cannot-deny: "&cВы начали это голосование! Используйте &e/draw &cснова, чтобы отменить."
      cancelled-self: "&cВы отменили голосование за ничью."
      cancelled-opponent: "&e{player} &cотменил голосование за ничью."
      already-active: "&e{opponent} &7уже проголосовал за ничью!\n&7Введите &a/draw accept &7или &c/draw deny"
      accepted: "&a&l━━━━━━━━━━━━━━━━━━━━━━━\n&a&lНИЧЬЯ ПРИНЯТА!\n&a&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7Оба игрока согласились на ничью.\n&7Все ставки будут возвращены."
      denied: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lНИЧЬЯ ОТКЛОНЕНА!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{player} &7отклонил ничью.\n&7Матч продолжается!"
      started: "&e&l━━━━━━━━━━━━━━━━━━━━━━━\n&e&lГОЛОСОВАНИЕ ЗА НИЧЬЮ\n&e&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{initiator} &7хочет завершить матч ничьей.\n\n&e{opponent}&7, введите:\n  &a/draw accept &7- Принять\n  &c/draw deny &7- Отклонить\n\n&7Лимит времени: &e{time} секунд"
      expired: "&c&lГолосование за ничью истекло!\n&7Матч продолжается."
    surrender:
      player-only: "&cКоманду могут использовать только игроки!"
      only-active: "&cСдаться можно только во время активного матча!"
      confirm: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lВНИМАНИЕ: СДАЧА\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7Вы уверены, что хотите сдаться?\n&cВы потеряете всю ставку!\n\n&7Введите &e/surrender confirm &7для подтверждения\n&7или подождите {timeout} сек. для отмены"
      confirm-expired: "&cПодтверждение сдачи истекло! Введите &e/surrender &cснова."
      surrendered: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l{player} СДАЛСЯ!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{opponent} &aпобеждает!"
  # ===== МАТЧ =====
  match-display:
    starting: "&eМатч начнется через &6&l{time} &eсекунд!"
    started: |
      
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      &a&lМАТЧ НАЧАЛСЯ!
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Удачи!
      
    
    spectator-join-announce: "&7{player} &eтеперь наблюдает."
    spectator-leave-announce: "&7{player} &eперестал наблюдать."
    
    spectator-joined: "&aВы наблюдаете за &e{player1} &aпротив &e{player2}&a!"
