# ============================================
# Equipment-Konfiguration (Events & PvPWager)
# ============================================
#
# Alle Sets stehen unter 'equipment:'. Frueher gab es dafuer drei Sektionen
# ('equipment', 'equipment-sets', 'equipment-groups'), die von PvP und Events in
# entgegengesetzter Reihenfolge gelesen wurden - waren zwei belegt, sahen die beiden
# Systeme verschiedene Sets unter derselben ID. Bestehende Dateien werden beim Start
# automatisch zusammengefuehrt; eine Sicherungskopie liegt dann als
# equipment.yml.bak-<zeitstempel> daneben.
#
# Der fruehere Block 'gui-item' fuehrte Titel und Lore ein zweites Mal, neben
# 'display-name' und 'description'. Uebrig geblieben sind daraus 'icon' und 'order';
# alte Dateien werden weiter gelesen ('gui-item.material' -> icon, 'gui-item.slot' ->
# order), 'gui-item.name' und 'gui-item.lore' gelten nicht mehr.
#
# Je Set:
#   pvpwager-equip-enable / event-equip-enable  Aktiv-Schalter, getrennt je System
#   allowed-pvpwager-worlds                     'all', 'none' oder eine Weltenliste
#   display-name                                Titel im Auswahlmenue und im Web-Panel
#   description                                 Lore im Auswahlmenue; mehrere Zeilen mit '|-'
#                                               (leer = automatische Ruestungsuebersicht)
#   icon                                        Material im Auswahlmenue
#                                               (weglassen = aus dem Brustpanzer abgeleitet)
#   order                                       Position im Auswahlmenue, kleinere Werte zuerst
#                                               (im Web-Panel per Hoch/Runter in der Uebersicht)
#   armor.<slot> + <slot>-enchantments/-name/-lore/-unbreakable
#   offhand + offhand-enchantments/-name/-lore/-unbreakable
#   inventory[]                                 slot, item, amount und die Item-Felder
#                                               (lore, unbreakable, custom-model-data,
#                                                item-flags, potion, damage)

equipment:
