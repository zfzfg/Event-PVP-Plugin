# ============================================
# Event-PVP Web Interface Konfiguration
# ============================================

web:
  # Web-Server aktivieren
  enabled: true
  
  # Port für den Web-Server
  port: 8085

  # Netzwerkadresse, an die der Web-Server gebunden wird.
  # Leer = alle Interfaces. "127.0.0.1" beschränkt das Panel auf den Server selbst,
  # was bei einem vorgeschalteten Reverse-Proxy die richtige Wahl ist.
  bind-address: ""

  # Öffentliche URL für das Web-Interface
  # Diese URL wird in der /eventpvp webtoken Nachricht angezeigt
  # Beispiele:
  #   - http://localhost:8085 (Standard, für lokalen Zugriff)
  #   - http://meinserver.de:8085 (Domain mit Port)
  #   - https://web.meinserver.de (Domain mit HTTPS)
  # {port} wird automatisch durch den konfigurierten Port ersetzt
  public-url: "http://localhost:{port}"
  
  # Titel im Browser-Tab
  title: "Event-PVP Konfigurator"
  
  # Theme-Farben (anpassbar)
  theme:
    # Hauptakzentfarbe
    primary-color: "#4caf50"
    # Sekundäre Akzentfarbe
    secondary-color: "#66bb6a"
    # Hintergrundfarbe (dunkelgrau)
    background-color: "#1a1a1a"
    # Zweiter Hintergrund für Panels
    surface-color: "#2d2d2d"
    # Dritter Hintergrund für Karten
    card-color: "#3a3a3a"
    # Textfarbe
    text-color: "#e0e0e0"
    # Sekundäre Textfarbe
    text-secondary: "#b0b0b0"
    # Fehlerfarbe
    error-color: "#f44336"
    # Warnfarbe
    warning-color: "#ff9800"
    # Erfolgsfarbe
    success-color: "#4caf50"
    # Info-Farbe
    info-color: "#2196f3"

# Sicherheitseinstellungen
security:
  # Token-basierte Authentifizierung aktivieren
  # Wenn true: Spieler müssen /eventpvp webtoken eingeben um Zugang zu bekommen
  # Wenn false: Keine Authentifizierung nötig (nur für lokale Entwicklung empfohlen!)
  auth-enabled: true
  
  # Wie lange ein Token gültig ist (in Minuten)
  # Spieler haben diese Zeit um sich einzuloggen nach /eventpvp webtoken
  token-validity-minutes: 10
  
  # Wie lange eine Session gültig bleibt (in Minuten)
  # Bei Aktivität wird die Session automatisch verlängert
  session-validity-minutes: 60
  
  # Erforderliche Permission für Web-Interface Zugang
  # Standard: eventpvp.admin.web
  # OP-Spieler haben immer Zugang
  required-permission: "eventpvp.admin.web"
  
  # Legacy-Einstellungen (nicht mehr verwendet)
  session-timeout: 24
  verification-timeout: 5
  password: ""
  
  # Erlaubte IPs (leer = alle erlaubt)
  allowed-ips: []

# Item-Texturen
#
# Die Icons für alle rund 1650 Items liegen im Plugin selbst (64x64 PNG). Das Panel
# braucht dafür keine Internetverbindung und zeigt auch Blöcke korrekt an.
items:
  # Icons anzeigen. Auf false zeigt das Panel nur Buchstaben-Platzhalter -
  # sinnvoll bei sehr langsamen Verbindungen.
  enable-textures: true

  # Nur als Ausweg für Items, zu denen das Plugin kein Icon mitbringt (etwa Items
  # einer neueren Minecraft-Version als das Plugin). Leer lassen, wenn das Panel
  # niemals nach außen verbinden soll.
  texture-source: "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.21/assets/minecraft/textures/item/"

  # Texturen aus dem Resourcepack des Servers übernehmen
  #
  # Ist unter resource-pack in der server.properties ein Pack hinterlegt, lädt das
  # Plugin es beim Start einmalig herunter, entpackt die Item-Texturen und zeigt sie
  # im Equipment-Editor statt der Vanilla-Icons. Damit sieht man beim Bauen eines Sets
  # dieselben Schwerter und Rüstungen wie die Spieler im Spiel.
  #
  # Übernommen werden ausschließlich direkte Ersetzungen unter
  # assets/minecraft/textures/item/. Texturen, die im Pack über CustomModelData an ein
  # Modell gebunden sind, werden bewusst nicht ausgewertet - dafür wäre ein vollständiger
  # Modell-Interpreter nötig, und der Vorteil stünde nicht im Verhältnis zum Risiko.
  #
  # Standardmäßig aus, weil dabei eine externe Datei heruntergeladen wird.
  resource-pack:
    enabled: false
    # Obergrenze für den Download in Megabyte. Größere Packs werden abgebrochen.
    max-size-mb: 50

# Interface-Einstellungen
#
# @loose-end(dead-config): der gesamte interface-Block wird von keiner Zeile Java oder JavaScript gelesen
#
# Diese Schalter beschreiben Verhalten, das das Panel fest verdrahtet hat: es speichert nie
# automatisch, fragt vor dem Speichern immer nach, hat keinen Auto-Refresh und eine feste
# Anzahl Undo-Schritte. Der Block bleibt vorerst stehen, damit bestehende Konfigurationen
# nicht mit Warnungen auffallen - entweder werden die Schalter noch angebunden oder sie
# entfallen in einer spaeteren Version.
interface:
  # Auto-Refresh Intervall in Sekunden (0 = deaktiviert)
  auto-refresh-interval: 0

  # Änderungen automatisch speichern
  auto-save: false

  # Bestätigung vor Speichern anzeigen
  confirm-save: true

  # Anzahl der Undo-Schritte
  max-undo-steps: 20

  # Kompakte Ansicht als Standard
  compact-view: false

  # Syntax-Highlighting aktivieren
  syntax-highlighting: true

# Editierbare Dateien
editable-files:
  - config.yml
  - worlds.yml
  - equipment.yml
  # messages.yml und plugin.yml sind ausgeschlossen
