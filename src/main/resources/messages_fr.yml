# ============================================
# PvPWager - Configuration des messages (FRANÇAIS)
# ============================================

messages:
  prefix: "&6[PvP]&r"
  
  # ===== SYSTÈME DE DEMANDES =====
  request:
    sent: "&aTu as envoyé une demande PvP à &e{player}&a!"
    
    received: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lDEMANDE PVP
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aveut se battre contre toi!
      
      &aClique ici pour accepter :
      
    received-clickable: "&a&l[► ACCEPTER ◄]"
    received-expire: "&7La demande expire dans &e60 secondes&7."
    
    accepted: "&aTu as accepté la demande de &e{player}&a!"
    denied: "&cTu as refusé la demande de &e{player}&c!"
    expired: "&cLa demande de &e{player} &ca expiré!"
    cancelled: "&cTu as annulé ta demande à &e{player}&c!"
    
    no-request: "&cTu n'as pas de demande de ce joueur!"
    already-sent: "&cTu as déjà envoyé une demande à ce joueur!"
    already-in-match: "&cCe joueur est déjà dans un match!"
    self-request: "&cTu ne peux pas t'envoyer une demande à toi-même!"
    player-offline: "&cCe joueur est hors ligne!"
    
    # Composants de la demande
    header: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lDEMANDE PVP
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aveut se battre contre toi!
      
    
    accept-button: "&a&l[► ACCEPTER ◄]"
    accept-hover: "&aClique pour accepter la demande!"
    deny-button: " &c&l[✖ REFUSER]"
    deny-hover: "&cClique pour refuser la demande"
    footer: |
      
      
      &7La demande expire dans &e60 secondes&7.
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
    
    # Messages de commande
    request-expired-sender: "&cTa demande à &e{target} &ca expiré!"
    request-expired-target: "&cLa demande de &e{sender} &ca expiré!"
    challenge-header: "&e&lDÉFI PVP!"
    challenge-message: "&e{player} &7t'a défié!"
  
  # ===== CONFIGURATION DE LA MISE =====
  wager:
    setup-start: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lCONFIGURE TA MISE
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Dépose tes objets et/ou ton argent
      &7dans le GUI!
      
      &7Clique sur &a&lCONFIRMER &7quand tu as fini.
      
    
    waiting-opponent: |
      &e&lEn attente de {player}...
      &7Ton adversaire configure
      &7sa mise.
    
    both-ready: |
      &a&lLES DEUX JOUEURS SONT PRÊTS!
      &7Choisissez maintenant l'arène et l'équipement.
    
    item-added: "&aObjet ajouté à la mise!"
    item-removed: "&cObjet retiré de la mise!"
    money-set: "&aMise d'argent définie: &6${amount}"
    money-increased: "&aMise d'argent augmentée: &6${amount}"
    money-decreased: "&cMise d'argent diminuée: &6${amount}"
    
    not-enough-money: "&cTu n'as pas assez d'argent! (&6${amount} &crequis)"
    inventory-full-self: "&cTon inventaire doit avoir au moins &e{slots} &cespaces libres!"
    inventory-full-opponent: "&cTon adversaire n'a pas assez de place dans son inventaire!"
    min-bet-required: "&cAu moins &e{amount} &cobjets ou &6${money} &crequis!"
    
    cancelled: "&cConfiguration de la mise annulée!"
  
  # ===== SÉLECTION ARÈNE & ÉQUIPEMENT =====
  selection:
    arena-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSÉLECTIONNER L'ARÈNE
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Choisis l'arène pour
      &7votre match!
      
    
    arena-selected: "&aArène sélectionnée: &e{arena}"
    
    equipment-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSÉLECTIONNER L'ÉQUIPEMENT
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Choisis ton set d'équipement
      &7pour le match!
      
    
    equipment-selected: "&aÉquipement sélectionné: &e{equipment}"
    
    waiting-opponent-choice: |
      &e&lEn attente de {player}...
      &7Ton adversaire est encore en train de choisir.
    
    both-selected: |
      &a&lTOUS LES CHOIX SONT FAITS!
      &7Le match commence bientôt...

  # ===== COMMANDES =====
  command:
    common:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      player-offline: "&cJoueur introuvable: {player}"
      self-target: "&cTu ne peux pas te cibler toi-même!"
      already-in-match: "&cTu es déjà dans un match!"
      target-in-match: "&c{player} est déjà dans un match!"
      pending-self: "&cTu as déjà une demande en attente!"
      pending-target: "&c{player} a déjà une demande en attente!"
      not-spectating: "&cTu ne regardes aucun match!"
      match-full: "&cLe match a atteint le nombre max de spectateurs!"
    pvpa:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      player-not-found: "&cJoueur introuvable: {player}"
      self-challenge: "&cTu ne peux pas te défier toi-même!"
      arena-not-found: "&cArène introuvable: {arena}"
      equipment-not-found: "&cÉquipement introuvable: {equipment}"
      amount-positive: "&cLe montant doit être positif!"
      economy-disabled: "&cL'économie n'est pas activée!"
      not-enough-money: "&cTu n'as pas assez d'argent! Solde: ${balance}"
      invalid-money: "&cMontant d'argent invalide: {amount}"
      mismatch-items: "&cDécalage entre objets et quantités!"
      not-enough-items: "&cTu n'as pas assez de: {item}"
      invalid-item: "&cObjet invalide: {item}"
      wager-money: "&6$${amount}"
      wager-items: "&e{count} objet(s)"
      request-sent: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lDEMANDE ENVOYÉE!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Cible: &e{target}
        &7Arène: &e{arena}
        &7Équipement: &e{equipment}
        &7Mise: {wager}
        
        &7En attente de réponse de &e{target}&7...
        
      usage: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lCOMMANDE PVPA
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Utilisation:
        &e/pvpa <joueur> <mise> <montant> <arene> <equipement>
        
        &7Exemples:
        &e/pvpa Steve DIAMOND_SWORD 1 desert diamond
        &e/pvpa Steve MONEY 100 forest standard
        &e/pvpa Steve DIAMOND_SWORD,GOLDEN_APPLE 1,5 colosseum netherite
        
        &7Utilise &e/pvpa arenas &7pour la liste des arènes
        &7Utilise &e/pvpa equipment &7pour la liste des équipements
        
      available-arenas: "&7Arènes disponibles:"
      available-equipment: "&7Équipements disponibles:"
    pvpyes:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      no-request: "&cAucune demande en attente!"
      waiting-response: "&cEn attente de la réponse de {player}!"
      sender-no-money: "&cTu n'as plus assez d'argent!"
      sender-no-items: "&cTu n'as plus les objets requis!"
      target-no-money-player: "&c{player} n'a plus assez d'argent!"
      target-no-money-target: "&cTu n'as plus assez d'argent - demande annulée!"
      target-no-items-player: "&c{player} n'a plus les objets requis!"
      target-no-items-target: "&cTu n'as plus les objets requis - demande annulée!"
    pvpadmin:
      no-permission: "&cTu n'as pas la permission pour cette commande!"
      reload-success: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lCONFIG RECHARGÉE!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7✓ Config principale rechargée
        &7✓ Messages rechargés
        &7✓ Arènes rechargées: &e{arenaCount}
        &7✓ Équipements rechargés: &e{equipmentCount}
        
        &eNote: &7Les matchs actifs ne sont pas affectés
        
      reload-error: "&cErreur lors du rechargement: {error}"
      stopall: |
        
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lMATCHS ARRÊTÉS
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Matchs actifs stoppés: &e{count}
        &7Toutes les mises ont été rendues
        
      info: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lINFO PVPWAGER
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Version: &e{version}
        &7Matchs actifs: &e{active}
        &7Arènes chargées: &e{arenas}
        &7Équipements chargés: &e{equipment}
        &7Économie: {economy}
        
      enabled: "&aActivé"
      disabled: "&cDésactivé"
      help: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lADMIN PVPWAGER
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &e/pvpadmin reload &8- &7Recharger toutes les configs
        &e/pvpadmin stopall &8- &7Arrêter tous les matchs actifs
        &e/pvpadmin info &8- &7Afficher les infos du plugin
        
  
    pvpanswer:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      no-request: "&cAucune demande en attente!"
      usage: |
        &cUtilisation: /pvpanswer <mise> <montant> [arene] [equipement]
        &7Exemple: /pvpanswer DIAMOND_SWORD 1
        &7Exemple: /pvpanswer MONEY 50 desert diamond
        &7Exemple: /pvpanswer SKIP
      arena-not-found: "&cArène introuvable: {arena}"
      equipment-not-found: "&cÉquipement introuvable: {equipment}"
      missing-money: "&cMontant manquant pour MONEY!"
      amount-positive: "&cLe montant doit être positif!"
      economy-disabled: "&cL'économie n'est pas activée!"
      not-enough-money: "&cTu n'as pas assez d'argent!"
      invalid-money: "&cMontant d'argent invalide: {amount}"
      missing-items: "&cQuantité manquante pour la mise d'objet!"
      mismatch-items: "&cDécalage entre objets et quantités!"
      not-enough-items: "&cTu n'as pas assez de: {item}"
      invalid-item: "&cObjet invalide: {item}"
      response-sent: "&a&lRÉPONSE ENVOYÉE!"
      your-wager-money: "&7Ta mise: &6${amount}"
      your-wager-items: "&7Ta mise: &e{items}"
      arena-override: "&7Arène forcée: &e{arena}"
      equipment-override: "&7Équipement forcé: &e{equipment}"
      waiting-confirm: "&7En attente de &e{player} &7pour confirmer..."
      challenger-header: "&e&l{player} A RÉPONDU!"
      their-wager-money: "&7Sa mise: &6${amount}"
      their-wager-items: "&7Sa mise: &e{items}"
      arena-changed: "&7Arène changée en: &e{arena}"
      equipment-changed: "&7Équipement changé en: &e{equipment}"
      next-steps: "&aTape &e/pvpyes &apour accepter\n&cTape &e/pvpno &cpour refuser"
    pvp:
      help: |
        &e&lPvPWager &8» &7Utilisation:
        &e/pvpa <joueur> &8- &7Envoyer une demande de mise PvP
        &e/pvp accept <joueur> &8- &7Accepter une demande
        &e/pvp deny <joueur> &8- &7Refuser une demande
        &e/pvp spectate <joueur> &8- &7Regarder un match
        &e/pvp leave &8- &7Quitter le mode spectateur
      accept:
        success-self: "&aTu as accepté la mise PvP de &e{player}&a!"
        success-other: "&e{player} &aa accepté ta mise PvP!"
        no-request: "&cAucune demande en attente de &e{player}&c!"
        requires-skip: "&cImpossible d'accepter: le challenger n'a pas choisi SKIP. Définis ta mise avec &e/pvpanswer <mise> <montant> &cd'abord."
      deny:
        success-self: "&cTu as refusé la mise PvP de &e{player}&c!"
        success-other: "&e{player} &ca refusé ta mise PvP!"
        usage: "&cUtilisation: /pvp deny <joueur>"
      spectate:
        usage: "&cUtilisation: /pvp spectate <joueur>"
        no-match: "&c{player} n'est dans aucun match!"
        joined: "&aTu regardes maintenant &e{p1} &7vs &e{p2}&a!"
        announce: "&e{player} &7regarde maintenant le match!"
      leave:
        left: "&aTu as quitté le mode spectateur!"
        announce: "&e{player} &7a quitté le mode spectateur!"
    pvprequest:
      usage: "&cUtilisation: /pvpa <joueur>"
      sent: "&aDemande de mise PvP envoyée à &e{player}&a!"
    pvpno:
      no-request: "&cAucune demande en attente!"
      declined-self: "&cTu as refusé la demande de/à &e{player}"
      declined-other: "&e{player} &ca refusé la demande!"
    challenge:
      usage: "&cUtilisation: /pvp challenge <joueur> [mise] [montant] [arene] [equipement]"
      no-config: "&cAucune arène ou équipement configuré!"
      sent: "&aDemande de mise PvP envoyée à &e{player}&a!"
    draw:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      only-active: "&cTu peux voter pour un nul uniquement pendant un match actif!"
      no-active-vote: "&cAucun vote de nul actif!"
      initiator-wait: "&cTu as lancé le vote de nul, attends ton adversaire!"
      initiator-cannot-deny: "&cTu as lancé ce vote! Utilise &e/draw &cencore pour l'annuler."
      cancelled-self: "&cTu as annulé ton vote de nul."
      cancelled-opponent: "&e{player} &ca annulé son vote de nul."
      already-active: "&e{opponent} &7a déjà voté pour un nul!\n&7Tape &a/draw accept &7ou &c/draw deny"
      accepted: "&a&l━━━━━━━━━━━━━━━━━━━━━━━\n&a&lNUL ACCEPTÉ!\n&a&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7Les deux joueurs acceptent un nul.\n&7Toutes les mises seront rendues."
      denied: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lNUL REFUSÉ!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{player} &7a refusé le vote.\n&7Le match continue!"
      started: "&e&l━━━━━━━━━━━━━━━━━━━━━━━\n&e&lVOTE DE NUL LANCÉ\n&e&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{initiator} &7veut terminer le match sur un nul.\n\n&e{opponent}&7, tape :\n  &a/draw accept &7- Accepter le nul\n  &c/draw deny &7- Refuser le nul\n\n&7Limite de temps: &e{time} secondes"
      expired: "&c&lVote de nul expiré!\n&7Le match continue."
    surrender:
      player-only: "&cSeuls les joueurs peuvent utiliser cette commande!"
      only-active: "&cTu peux abandonner uniquement pendant un match actif!"
      confirm: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lAVERTISSEMENT: ABANDON\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7Es-tu sûr de vouloir abandonner?\n&cTu perdras toute ta mise!\n\n&7Tape &e/surrender confirm &7pour confirmer\n&7ou attends {timeout} secondes pour annuler"
      confirm-expired: "&cConfirmation d'abandon expirée! Tape &e/surrender &cà nouveau."
      surrendered: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l{player} A ABANDONNÉ!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{opponent} &aremporte le match!"
  
  # ===== MATCH =====
  match-display:
    starting: "&eLe match commence dans &6&l{time} &esecondes!"
    started: |
      
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      &a&lMATCH DÉMARRÉ!
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Bonne chance!
      
    
    spectator-join-announce: "&7{player} &eobserve maintenant."
    spectator-leave-announce: "&7{player} &ena termine d'observer."
    
    spectator-joined: "&aTu observes &e{player1} &avs &e{player2}&a!"
    spectator-left: "&7Tu n'observes plus."
    
    boundaries-warning: "&c&lATTENTION: &cLimite de l'arène atteinte!"
    you-won-header: "&a&l━━━━━━━━━━━━━━━━━━━━━━━"
    you-won: "&a&lTU AS GAGNÉ!"
    you-lost-header: "&c&l━━━━━━━━━━━━━━━━━━━━━━━"
    you-lost: "&c&lTU AS PERDU!"
    
    # Messages de début de match
    match-starting: "&a&lMATCH EN DÉMARRAGE!"
    match-starting-divider: "&e&l━━━━━━━━━━━━━━━━━━━━━━━"
    vs-display: "&e{player1} &7vs &e{player2}"
    arena-display: "&7Arène: &e{arena}"
    equipment-display: "&7Équipement: &e{equipment}"
    arena-countdown: "&eChargement de l'arène... &7(5 secondes)"
    fight-divider: "&a&l━━━━━━━━━━━━━━━━━━━━━━━"
    fight: "&e&lCOMBATTEZ!"
  
  # ===== FIN DE MATCH =====
  end:
    winner: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &6&l{player} A GAGNÉ!
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
    
    surrender: "&e{player} &ca abandonné!"
    
    draw: |
      
      &e&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lMATCH NUL!
      &e&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Toutes les mises sont rendues.
      
    
    timeout: |
      
      &c&l━━━━━━━━━━━━━━━━━━━━━━━
      &c&lTEMPS ÉCOULÉ!
      &c&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Match nul - Temps dépassé.
      
    
    items-returned: "&7Tes mises ont été rendues."
    items-won: |
      
