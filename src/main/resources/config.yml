    min-players: 2
    max-players: 16
    countdown-time: 45

    worlds:
      lobby-world: "EventLobby"
      lobby-spawn:
        x: 0.5
        y: 65
        z: 0.5
        yaw: 0
        pitch: 0
      event-world: "PvPArena"
      clone-source-event-world: "PvPArena_original"
      build-allowed: false
      regenerate-event-world: false
      regenerate-lobby-world: false

    spawn-settings:
      # Einfacher Start: Alle Spieler an einem Punkt (Beispiel)
      spawn-type: "SINGLE_POINT"
      single-spawn:
        x: 0.5
        y: 65
        z: 0.5
        yaw: 0
        pitch: 0

    equipment-group: "pvp_starter"
    give-equipment-in-lobby: true

    mechanics:
      game-mode: "SOLO"
      pvp-enabled: true
      hunger-enabled: true
      win-condition:
        type: "LAST_ALIVE"
      death-handling:
        eliminate-on-death: true
        spectator-mode: true
        allow-rejoin: false

    rewards:
