# ============================================
# PvPWager - Configuración de mensajes (ESPAÑOL)
# ============================================

messages:
  prefix: "&6[PvP]&r"
  
  # ===== SISTEMA DE SOLICITUDES =====
  request:
    sent: "&aHas enviado una solicitud de PvP a &e{player}&a!"
    
    received: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSOLICITUD PVP
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aquiere pelear contigo!
      
      &aHaz clic aquí para aceptar:
      
    received-clickable: "&a&l[► ACEPTAR ◄]"
    received-expire: "&7La solicitud expira en &e60 segundos&7."
    
    accepted: "&aHas aceptado la solicitud de &e{player}&a!"
    denied: "&cHas rechazado la solicitud de &e{player}&c!"
    expired: "&cLa solicitud de &e{player} &cha expirado!"
    cancelled: "&cHas cancelado tu solicitud a &e{player}&c!"
    
    no-request: "&cNo tienes una solicitud de este jugador!"
    already-sent: "&cYa enviaste una solicitud a este jugador!"
    already-in-match: "&cEste jugador ya está en un combate!"
    self-request: "&cNo puedes enviarte una solicitud a ti mismo!"
    player-offline: "&cEse jugador está desconectado!"
    
    # Componentes de solicitud
    header: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSOLICITUD PVP
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &e{player} &aquiere pelear contigo!
      
    
    accept-button: "&a&l[► ACEPTAR ◄]"
    accept-hover: "&aHaz clic para aceptar la solicitud!"
    deny-button: " &c&l[✖ RECHAZAR]"
    deny-hover: "&cHaz clic para rechazar la solicitud"
    footer: |
      
      
      &7La solicitud expira en &e60 segundos&7.
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
    
    # Mensajes de comandos
    request-expired-sender: "&cTu solicitud a &e{target} &cha expirado!"
    request-expired-target: "&cLa solicitud de &e{sender} &cha expirado!"
    challenge-header: "&e&l¡DESAFÍO PVP!"
    challenge-message: "&e{player} &7te ha desafiado!"
  
  # ===== CONFIGURACIÓN DE APUESTA =====
  wager:
    setup-start: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lCONFIGURA TU APUESTA
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Coloca tus objetos y/o dinero
      &7en la GUI!
      
      &7Haz clic en &a&lCONFIRMAR &7cuando termines.
      
    
    waiting-opponent: |
      &e&lEsperando a {player}...
      &7Tu oponente está configurando
      &7su apuesta.
    
    both-ready: |
      &a&l¡AMBOS JUGADORES LISTOS!
      &7Ahora elige arena y equipamiento.
    
    item-added: "&aObjeto añadido a la apuesta!"
    item-removed: "&cObjeto eliminado de la apuesta!"
    money-set: "&aApuesta en dinero: &6${amount}"
    money-increased: "&aApuesta aumentada: &6${amount}"
    money-decreased: "&cApuesta reducida: &6${amount}"
    
    not-enough-money: "&cNo tienes suficiente dinero! Se necesitan &6${amount}&c"
    inventory-full-self: "&cTu inventario debe tener al menos &e{slots} &cespacios libres!"
    inventory-full-opponent: "&cTu oponente no tiene suficiente espacio!"
    min-bet-required: "&cSe requieren al menos &e{amount} &cobjetos o &6${money}&c!"
    
    cancelled: "&cConfiguración de apuesta cancelada!"
  
  # ===== SELECCIÓN DE ARENA Y EQUIPO =====
  selection:
    arena-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSELECCIONA ARENA
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Elige la arena para
      &7tu combate!
      
    
    arena-selected: "&aArena seleccionada: &e{arena}"
    
    equipment-select: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lSELECCIONA EQUIPAMIENTO
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Elige el set de equipamiento
      &7para el combate!
      
    
    equipment-selected: "&aEquipamiento seleccionado: &e{equipment}"
    
    waiting-opponent-choice: |
      &e&lEsperando a {player}...
      &7Tu oponente sigue eligiendo.
    
    both-selected: |
      &a&l¡TODO LISTO!
      &7El combate comienza pronto...

  # ===== COMANDOS =====
  command:
    common:
      player-only: "&cSolo los jugadores pueden usar este comando!"
      player-offline: "&cJugador no encontrado: {player}"
      self-target: "&cNo puedes apuntarte a ti mismo!"
      already-in-match: "&cYa estás en un combate!"
      target-in-match: "&c{player} ya está en un combate!"
      pending-self: "&cYa tienes una solicitud pendiente!"
      pending-target: "&c{player} ya tiene una solicitud pendiente!"
      not-spectating: "&cNo estás espectando ningún combate!"
      match-full: "&cEl combate tiene demasiados espectadores!"
    pvpa:
      player-only: "&cSolo jugadores pueden usar este comando!"
      player-not-found: "&cJugador no encontrado: {player}"
      self-challenge: "&cNo puedes desafiarte a ti mismo!"
      arena-not-found: "&cArena no encontrada: {arena}"
      equipment-not-found: "&cEquipamiento no encontrado: {equipment}"
      amount-positive: "&cLa cantidad debe ser positiva!"
      economy-disabled: "&cLa economía no está habilitada!"
      not-enough-money: "&cNo tienes suficiente dinero! Tienes: ${balance}"
      invalid-money: "&cCantidad inválida: {amount}"
      mismatch-items: "&cLos objetos y cantidades no coinciden!"
      not-enough-items: "&cNo tienes suficientes: {item}"
      invalid-item: "&cObjeto inválido: {item}"
      wager-money: "&6$${amount}"
      wager-items: "&e{count} objeto(s)"
      request-sent: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lSOLICITUD ENVIADA!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Objetivo: &e{target}
        &7Arena: &e{arena}
        &7Equipamiento: &e{equipment}
        &7Apuesta: {wager}
        
        &7Esperando a &e{target} &7para responder...
        
      usage: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lCOMANDO PVPA
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Uso:
        &e/pvpa <jugador> <apuesta> <cantidad> <arena> <equipamiento>
        
        &7Ejemplos:
        &e/pvpa Steve DIAMOND_SWORD 1 desert diamond
        &e/pvpa Steve MONEY 100 forest standard
        &e/pvpa Steve DIAMOND_SWORD,GOLDEN_APPLE 1,5 colosseum netherite
        
        &7Usa &e/pvpa arenas &7para listar arenas
        &7Usa &e/pvpa equipment &7para listar equipamiento
        
      available-arenas: "&7Arenas disponibles:"
      available-equipment: "&7Equipamiento disponible:"
    pvpyes:
      player-only: "&cSolo jugadores pueden usar este comando!"
      no-request: "&cNo hay solicitud pendiente!"
      waiting-response: "&cEsperando respuesta de {player}!"
      sender-no-money: "&cYa no tienes suficiente dinero!"
      sender-no-items: "&cYa no tienes los objetos requeridos!"
      target-no-money-player: "&c{player} ya no tiene suficiente dinero!"
      target-no-money-target: "&cYa no tienes suficiente dinero — solicitud cancelada!"
      target-no-items-player: "&c{player} ya no tiene los objetos requeridos!"
      target-no-items-target: "&cNo tienes los objetos requeridos — solicitud cancelada!"
    pvpadmin:
      no-permission: "&cNo tienes permiso para este comando!"
      reload-success: |
        
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        &a&lCONFIG RECARGADA!
        &a&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7✓ Config principal recargada
        &7✓ Mensajes recargados
        &7✓ Arenas cargadas: &e{arenaCount}
        &7✓ Equipamiento cargado: &e{equipmentCount}
        
        &eNota: &7Los combates activos no se ven afectados
        
      reload-error: "&cError al recargar: {error}"
      stopall: |
        
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        &e&lCOMBATES DETENIDOS
        &e&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Detenidos &e{count} &7combates activos
        &7Todas las apuestas han sido devueltas
        
      info: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lINFO PVPWAGER
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &7Versión: &e{version}
        &7Combates activos: &e{active}
        &7Arenas cargadas: &e{arenas}
        &7Equipamiento cargado: &e{equipment}
        &7Economía: {economy}
        
      enabled: "&aActivado"
      disabled: "&cDesactivado"
      help: |
        
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        &6&lADMIN PVPWAGER
        &6&l━━━━━━━━━━━━━━━━━━━━━━━
        
        &e/pvpadmin reload &8- &7Recargar todo
        &e/pvpadmin stopall &8- &7Detener todos los combates
        &e/pvpadmin info &8- &7Mostrar información del plugin
        
  
    pvpanswer:
      player-only: "&cSolo jugadores pueden usar este comando!"
      no-request: "&cNo hay solicitud pendiente!"
      usage: |
        &cUso: /pvpanswer <apuesta> <cantidad> [arena] [equipamiento]
        &7Ejemplo: /pvpanswer DIAMOND_SWORD 1
        &7Ejemplo: /pvpanswer MONEY 50 desert diamond
        &7Ejemplo: /pvpanswer SKIP
      arena-not-found: "&cArena no encontrada: {arena}"
      equipment-not-found: "&cEquipamiento no encontrado: {equipment}"
      missing-money: "&cFalta cantidad para MONEY!"
      amount-positive: "&cLa cantidad debe ser positiva!"
      economy-disabled: "&cLa economía no está habilitada!"
      not-enough-money: "&cNo tienes suficiente dinero!"
      invalid-money: "&cCantidad inválida: {amount}"
      missing-items: "&cFalta cantidad para apuesta de objetos!"
      mismatch-items: "&cLos objetos y cantidades no coinciden!"
      not-enough-items: "&cNo tienes suficientes: {item}"
      invalid-item: "&cObjeto inválido: {item}"
      response-sent: "&a&lRESPUESTA ENVIADA!"
      your-wager-money: "&7Tu apuesta: &6${amount}"
      your-wager-items: "&7Tu apuesta: &e{items}"
      arena-override: "&7Arena cambiada a: &e{arena}"
      equipment-override: "&7Equipamiento cambiado a: &e{equipment}"
      waiting-confirm: "&7Esperando confirmación de &e{player}&7..."
      challenger-header: "&e&l{player} RESPONDIÓ!"
      their-wager-money: "&7Su apuesta: &6${amount}"
      their-wager-items: "&7Su apuesta: &e{items}"
      arena-changed: "&7Arena cambiada a: &e{arena}"
      equipment-changed: "&7Equipamiento cambiado a: &e{equipment}"
      next-steps: "&aEscribe &e/pvpyes &apara aceptar\n&cEscribe &e/pvpno &cpara rechazar"
    pvp:
      help: |
        &e&lPvPWager &8» &7Uso:
        &e/pvpa <jugador> &8- &7Enviar solicitud de apuesta
        &e/pvp accept <jugador> &8- &7Aceptar solicitud
        &e/pvp deny <jugador> &8- &7Rechazar solicitud
        &e/pvp spectate <jugador> &8- &7Espectar combate
        &e/pvp leave &8- &7Salir de espectador
      accept:
        success-self: "&aHas aceptado la solicitud de &e{player}&a!"
        success-other: "&e{player} &aaceptó tu solicitud!"
        no-request: "&cNo hay solicitud pendiente de &e{player}&c!"
        requires-skip: "&cNo se puede aceptar: el retador no eligió SKIP. Configura tu apuesta con &e/pvpanswer <apuesta> <cantidad>&c."
      deny:
        success-self: "&cHas rechazado la solicitud de &e{player}&c!"
        success-other: "&e{player} &crechazó tu solicitud!"
        usage: "&cUso: /pvp deny <jugador>"
      spectate:
        usage: "&cUso: /pvp spectate <jugador>"
        no-match: "&c{player} no está en un combate!"
        joined: "&aAhora espectas a &e{p1} &7vs &e{p2}&a!"
        announce: "&e{player} &7ahora está espectando!"
      leave:
        left: "&aHas salido del modo espectador!"
        announce: "&e{player} &7salió del modo espectador!"
    pvprequest:
      usage: "&cUso: /pvpa <jugador>"
      sent: "&aSolicitud de apuesta enviada a &e{player}&a!"
    pvpno:
      no-request: "&cNo hay solicitud pendiente!"
      declined-self: "&cHas rechazado la solicitud de/a &e{player}"
      declined-other: "&e{player} &crechazó la solicitud!"
    challenge:
      usage: "&cUso: /pvp challenge <jugador> [apuesta] [cantidad] [arena] [equipamiento]"
      no-config: "&cNo hay arenas o equipamiento configurado!"
      sent: "&aSolicitud de apuesta enviada a &e{player}&a!"
    draw:
      player-only: "&cSolo jugadores pueden usar este comando!"
      only-active: "&cSolo puedes votar empate en un combate activo!"
      no-active-vote: "&cNo hay voto de empate activo!"
      initiator-wait: "&cHas iniciado el voto, espera a tu oponente!"
      initiator-cannot-deny: "&cTú iniciaste este voto! Usa &e/draw &cde nuevo para cancelarlo."
      cancelled-self: "&cHas cancelado el voto de empate."
      cancelled-opponent: "&e{player} &c_canceló el voto de empate."
      already-active: "&e{opponent} &7ya votó por empate!\n&7Escribe &a/draw accept &7o &c/draw deny"
      accepted: "&a&l━━━━━━━━━━━━━━━━━━━━━━━\n&a&lEMPATE ACEPTADO!\n&a&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7Ambos jugadores aceptaron el empate.\n&7Todas las apuestas serán devueltas."
      denied: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lEMPATE RECHAZADO!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{player} &7rechazó el empate.\n&7El combate continúa!"
      started: "&e&l━━━━━━━━━━━━━━━━━━━━━━━\n&e&lVOTO DE EMPATE\n&e&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{initiator} &7quiere terminar en empate.\n\n&e{opponent}&7, escribe:\n  &a/draw accept &7- Aceptar\n  &c/draw deny &7- Rechazar\n\n&7Tiempo límite: &e{time} segundos"
      expired: "&c&lEl voto de empate ha expirado!\n&7El combate continúa."
    surrender:
      player-only: "&cSolo jugadores pueden usar este comando!"
      only-active: "&cSolo puedes rendirte durante un combate activo!"
      confirm: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&lADVERTENCIA: RENDIRSE\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&7¿Seguro que quieres rendirte?\n&cPerderás toda tu apuesta!\n\n&7Escribe &e/surrender confirm &7para confirmar\n&7o espera {timeout} segundos para cancelar"
      confirm-expired: "&cLa confirmación de rendición expiró! Escribe &e/surrender &cde nuevo."
      surrendered: "&c&l━━━━━━━━━━━━━━━━━━━━━━━\n&c&l{player} SE RINDIÓ!\n&c&l━━━━━━━━━━━━━━━━━━━━━━━\n\n&e{opponent} &agano el combate!"
  # ===== COMBATE =====
  match-display:
    starting: "&eEl combate inicia en &6&l{time} &esegundos!"
    started: |
      
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      &a&lCOMBATE INICIADO!
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Buena suerte!
      
    
    spectator-join-announce: "&7{player} &eahora está espectando."
    spectator-leave-announce: "&7{player} &edejó de espectar."
    
    spectator-joined: "&aEstás espectando a &e{player1} &avs &e{player2}&a!"
    spectator-left: "&7Has dejado de espectar."
    
    boundaries-warning: "&c&lADVERTENCIA: &cHas llegado al límite de la arena!"
    you-won-header: "&a&l━━━━━━━━━━━━━━━━━━━━━━━"
    you-won: "&a&lHAS GANADO!"
    you-lost-header: "&c&l━━━━━━━━━━━━━━━━━━━━━━━"
    you-lost: "&c&lHAS PERDIDO!"
    
    # Inicio de combate
    match-starting: "&a&lEL COMBATE EMPIEZA!"
    match-starting-divider: "&e&l━━━━━━━━━━━━━━━━━━━━━━━"
    vs-display: "&e{player1} &7vs &e{player2}"
    arena-display: "&7Arena: &e{arena}"
    equipment-display: "&7Equipamiento: &e{equipment}"
    arena-countdown: "&eCargando arena... &7(5 segundos)"
    fight-divider: "&a&l━━━━━━━━━━━━━━━━━━━━━━━"
    fight: "&e&l¡LUCHA!"
  
  # ===== FIN DEL COMBATE =====
  end:
    winner: |
      
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      &6&l{player} GANÓ!
      &6&l━━━━━━━━━━━━━━━━━━━━━━━
      
    
    surrender: "&e{player} &cse rindió!"
    
    draw: |
      
      &e&l━━━━━━━━━━━━━━━━━━━━━━━
      &e&lEMPATE!
      &e&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Todas las apuestas fueron devueltas.
      
    
    timeout: |
      
      &c&l━━━━━━━━━━━━━━━━━━━━━━━
      &c&l¡TIEMPO AGOTADO!
      &c&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Empate — tiempo excedido.
      
    
    items-returned: "&7Tus apuestas han sido devueltas."
    items-won: |
      
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      &a&lHAS GANADO!
      &a&l━━━━━━━━━━━━━━━━━━━━━━━
      
      &7Recibiste todas las apuestas!
      
    money-won: "&aGanaste &6&l${amount}&a!"
    items-received: "&aHas recibido &e{count} &aobjeto(s)!"
  
